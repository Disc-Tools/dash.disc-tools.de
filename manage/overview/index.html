<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111014">
    <title>Server overview | Disc-Tools</title>
    <link rel="icon" href="/static/assets/img/disc-tools.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://dash.disc-tools.de" crossorigin>
    <link rel="preload" href="/static/fonts/SpaceGrotesk/SpaceGrotesk.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/dashboard.css?v=launch-20261117">
    <link rel="stylesheet" href="/static/css/server-overview.css?v=launch-20261117">
    <script src="/static/js/dashboard-session.js?v=launch-20261117" defer></script>
    <script src="/static/js/server-overview.js?v=launch-20261117" defer></script>
</head>
<body class="manage-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <aside class="manage-sidebar" aria-label="Server">
        <div class="manage-sidebar-top">
            <button class="manage-sidebar-toggle button button-outline" type="button" aria-controls="manage-sidebar-body" aria-expanded="false" hidden>Server menu</button>
        </div>
        <div class="manage-sidebar-body" id="manage-sidebar-body">
            <div class="manage-identity" id="manage-identity" hidden>
                <div class="manage-icon" aria-hidden="true"></div>
                <div><strong id="manage-server-name"></strong><small id="manage-server-id"></small></div>
            </div>
            <nav id="manage-navigation" class="manage-nav" aria-label="Server management" hidden>
                <a href="#main" aria-current="page">Overview</a>
                <a data-panel="verification">Verification</a>
                <a data-panel="honeypot">Honeypot</a>
                <a data-panel="bump">Bump Reminder</a>
            </nav>
        </div>
        <div class="manage-sidebar-actions">
            <a class="button button-outline" id="manage-settings" data-panel="settings" hidden>Settings</a>
            <a class="manage-back button button-outline" href="/my-servers/"><span aria-hidden="true">←</span> Back to my servers</a>
        </div>
    </aside>

    <main class="manage-main" id="main" tabindex="-1">
        <div class="manage-content">
            <h1>Overview</h1>
            <div class="manage-status" id="manage-status" role="status">
                <span id="manage-status-text">Loading server overview…</span>
                <div id="manage-status-actions"></div>
            </div>

            <div id="manage-overview" hidden>
                <dl class="manage-stats" aria-label="Server statistics">
                    <div><dt>Members</dt><dd id="stat-members">–</dd></div>
                    <div><dt>Online</dt><dd id="stat-online">–</dd></div>
                    <div><dt>Roles</dt><dd id="stat-roles">–</dd></div>
                    <div><dt>Boosts</dt><dd id="stat-boosts">–</dd></div>
                </dl>
                <section class="manage-growth" aria-labelledby="growth-title">
                    <div class="growth-header">
                        <div>
                            <h2 id="growth-title">Member growth</h2>
                            <p id="growth-summary" role="status">Loading member history…</p>
                        </div>
                        <div class="growth-periods" role="group" aria-label="Chart period">
                            <button type="button" data-days="3" aria-pressed="false">3 days</button>
                            <button type="button" data-days="7" aria-pressed="true">7 days</button>
                            <button type="button" data-days="30" aria-pressed="false">30 days</button>
                        </div>
                    </div>
                    <div id="growth-chart" hidden>
                        <div class="growth-plot">
                            <div class="growth-scale" aria-hidden="true"></div>
                            <div class="growth-graph" aria-hidden="true">
                                <svg viewBox="0 0 600 160" preserveAspectRatio="none"></svg>
                                <div class="growth-points"></div>
                            </div>
                        </div>
                        <div class="growth-dates" aria-hidden="true"></div>
                    </div>
                    <details class="growth-details" id="growth-details" hidden>
                        <summary>View daily counts</summary>
                        <table>
                            <thead><tr><th scope="col">Date</th><th scope="col">Members</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </details>
                </section>
            </div>
            <noscript><p><a href="https://dash.disc-tools.de/my-servers/">Open the live dashboard</a>.</p></noscript>
        </div>
    </main>
</body>
</html>
